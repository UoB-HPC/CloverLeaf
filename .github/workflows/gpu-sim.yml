name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so the `cuda`
# variant in linux.yml builds with tests off. This builds the CUDA model and runs
# the ctest `solution_*` cases on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0 on simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator runs PTX only, so CUDA_ARCH=compute_90 (the model passes it
      # as -arch=compute_90), and it needs a shared CUDA runtime.
      - name: Configure CMake
        run: |
          cmake -B build -S . \
                -DMODEL=cuda \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.0/bin/nvcc \
                -DCUDA_ARCH=compute_90 \
                -DCUDA_EXTRA_FLAGS="-cudart shared"

      - name: Build
        run: cmake --build build -j3

      # solution_reference is not run: it is the 3840x3840 benchmark deck
      # (clover_bm16_short.in). The other 17 cases use small meshes and take a
      # few seconds each on the simulator. The default 60 s ctest timeout is
      # raised to leave room for the slower hosted runners.
      - name: Run tests
        run: vgpu run ctest --test-dir build -E '^solution_reference$' --timeout 300 --output-on-failure
